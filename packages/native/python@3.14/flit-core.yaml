package: native/python@3.14/flit-core
version: 0.0.0
type: native
download:
    - kind: git
      url: https://github.com/pypa/flit.git
      sha256: 92c9486a543c4db266e3908bffc984060b8466af
dependencies:
    - '*:*:native/python@3.14'
build:
    env: []
    steps:
        - '*:*:cd flit_core && pip3 install --root $STAGING_DIR --prefix $NATIVEPREFIX --no-deps --no-build-isolation --no-index --disable-pip-version-check .'
