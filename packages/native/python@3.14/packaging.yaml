package: native/python@3.14/packaging
version: "26.0"
type: native
download:
    - kind: git
      url: https://github.com/pypa/packaging
      sha256: 3b77a26f5a27473ad3b08194d773f325d018a2d0
dependencies:
    - '*:*:native/python@3.14'
    - '*:*:native/python@3.14/flit-core'
build:
    env: []
    steps:
        - '*:*:pip3 install --root $STAGING_DIR --prefix $NATIVEPREFIX --no-deps --no-build-isolation --no-index --disable-pip-version-check .'
