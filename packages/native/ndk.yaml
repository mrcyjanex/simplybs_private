        - '*:*-android*:touch prebuilts/clang/host/linux-x86/clang-r563880c/NOTICE'
        - '*:*-android*:touch prebuilts/clang/host/windows-x86/clang-r563880c/NOTICE'
        - '*:*-android*:mkdir -p prebuilts/simpleperf'
        - '*:*-android*:touch prebuilts/simpleperf/NOTICE'
        - '*:*-android*:cd ndk && python3 checkbuild.py'
