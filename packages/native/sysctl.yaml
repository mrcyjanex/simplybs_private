package: native/sysctl
version: 1.0.0
type: native
dependencies:
    - '*:*:native/_/_'
build:
    env: []
    steps:
        - |-
          darwin_*:*:cat > sysctl.c << 'END'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <stdint.h>
          #include <sys/sysctl.h>

          static int is_text(const unsigned char *buf, size_t len) {
          	size_t i;
          	if (len == 0 || buf[len - 1] != '\0')
          		return 0;
          	if (buf[0] == '\0')
          		return 0;
          	for (i = 0; buf[i] != '\0'; i++) {
          		if (buf[i] < 0x20 || buf[i] > 0x7e)
          			return 0;
          	}
          	return 1;
          }

          static int show(const char *name, int values_only, int ignore) {
          	unsigned char *buf;
          	size_t len = 0;

          	if (sysctlbyname(name, NULL, &len, NULL, 0) != 0) {
          		if (ignore)
          			return 0;
          		fprintf(stderr, "sysctl: unknown oid '%s'\n", name);
          		return 1;
          	}
          	buf = calloc(1, len + 1);
          	if (buf == NULL)
          		return 1;
          	if (sysctlbyname(name, buf, &len, NULL, 0) != 0) {
          		free(buf);
          		if (ignore)
          			return 0;
          		fprintf(stderr, "sysctl: unknown oid '%s'\n", name);
          		return 1;
          	}

          	if (is_text(buf, len)) {
          		if (values_only)
          			printf("%s\n", (char *)buf);
          		else
          			printf("%s: %s\n", name, (char *)buf);
          	} else if (len == 4) {
          		int32_t v;
          		memcpy(&v, buf, 4);
          		if (values_only)
          			printf("%d\n", v);
          		else
          			printf("%s: %d\n", name, v);
          	} else if (len == 8) {
          		int64_t v;
          		memcpy(&v, buf, 8);
          		if (values_only)
          			printf("%lld\n", (long long)v);
          		else
          			printf("%s: %lld\n", name, (long long)v);
          	} else {
          		fprintf(stderr, "sysctl: unsupported value for %s\n", name);
          		free(buf);
          		return 1;
          	}
          	free(buf);
          	return 0;
          }

          int main(int argc, char **argv) {
          	int values_only = 0;
          	int ignore = 0;
          	int any = 0;
          	int rc = 0;
          	int i;

          	for (i = 1; i < argc; i++) {
          		if (argv[i][0] == '-' && argv[i][1] != '\0') {
          			char *p;
          			for (p = argv[i] + 1; *p; p++) {
          				if (*p == 'n')
          					values_only = 1;
          				else if (*p == 'i')
          					ignore = 1;
          				else {
          					fprintf(stderr, "sysctl: unknown option -%c\n", *p);
          					return 1;
          				}
          			}
          		} else {
          			any = 1;
          			if (show(argv[i], values_only, ignore) != 0)
          				rc = 1;
          		}
          	}
          	if (!any) {
          		fprintf(stderr, "sysctl: missing oid\n");
          		return 1;
          	}
          	return rc;
          }
          END
        - darwin_*:*:mkdir -p $STAGING_DIR$NATIVEPREFIX/bin
        - darwin_*:*:$CC -O2 -o $STAGING_DIR$NATIVEPREFIX/bin/sysctl sysctl.c
