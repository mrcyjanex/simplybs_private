dependencies:
    - '*:*:native/_/_'
    - '*:*:native/dart-bin@3.4.0-247.0.dev'
    - '*:*:native/git'
    - '*:*:native/gn'
    - '*:*:native/libc++'
    - '*:*:native/llvm-ar'
    - '*:*:native/llvm-nm'
    - '*:*:native/llvm-strip'
    - '*:*:native/make'
    - '*:*:native/ninja'
    - '*:*:native/python@3.11'
    - '*:*:native/zlib'
build:
    env:
        - linux_amd64:*:BUILDTARGET=linux-x64
        - linux_arm64:*:BUILDTARGET=linux-arm64
        - darwin_arm64:*:BUILDTARGET=mac-arm64
        - linux_*:*:DART_USE_SYSROOT=x64=$NATIVEPREFIX/_/sysroot,arm64=$NATIVEPREFIX/_/sysroot
    steps:
        - '*:*:mkdir -p buildtools/mac-x64/clang/.versions'
        - '*:*:mkdir -p buildtools/mac-arm64/clang/.versions'
        - '*:*:mkdir -p buildtools/linux-x64/clang/.versions'
        - '*:*:mkdir -p buildtools/linux-arm64/clang/.versions'
        - '*:*:echo ''{"package_name": "fuchsia/third_party/clang/mac-amd64","instance_id": "AWO66yebzYxWzasSzjx1wmeozi-xq9r0RnNyEhKtwAIC"}'' > ./buildtools/mac-x64/clang/.versions/clang.cipd_version'
        - '*:*:echo ''{"package_name": "fuchsia/third_party/clang/mac-arm64","instance_id": "i41U-bFSUAOHPpKs_6lCF-EPqOLaa8LwT48ciXzHK3EC"}'' > ./buildtools/mac-arm64/clang/.versions/clang.cipd_version'
        - '*:*:echo ''{"package_name": "fuchsia/third_party/clang/linux-amd64","instance_id": "-f7MR6VniTzxeWcp2k9ZkII4oK21j44tQvYuCBaHpqEC"}'' > ./buildtools/linux-x64/clang/.versions/clang.cipd_version'
        - '*:*:echo ''{"package_name": "fuchsia/third_party/clang/linux-arm64","instance_id": "-f7MR6VniTzxeWcp2k9ZkII4oK21j44tQvYuCBaHpqEC"}'' > ./buildtools/linux-arm64/clang/.versions/clang.cipd_version'
        - '*:*:mkdir -p buildtools/sysroot/linux/.versions'
        - '*:*:mkdir -p buildtools/sysroot/focal/.versions'
        - '*:*:echo ''{"package_name": "dart/sysroot/linux","instance_id": "simplybs"}'' > ./buildtools/sysroot/linux/.versions/sysroot.cipd_version'
        - '*:*:echo ''{"package_name": "dart/sysroot/focal","instance_id": "simplybs"}'' > ./buildtools/sysroot/focal/.versions/sysroot.cipd_version'
        - '*:*:echo build_devtools_from_sources = false > build/config/gclient_args.gni'
        - '*:*:ln -s $(which gn) buildtools/gn'
        - '*:*:mkdir -p buildtools/ninja'
        - '*:*:ln -s $(which ninja) buildtools/ninja/ninja'
        - '*:*:mkdir -p buildtools/$BUILDTARGET/clang/bin'
        - '*:*:mkdir -p buildtools/$BUILDTARGET/clang/lib'
        - '*:*:ln -s $NATIVEPREFIX/lib/libc++.a buildtools/$BUILDTARGET/clang/lib/libc++.a'
        - '*:*:printf ''#!/bin/sh\nexec %s "$@"\n'' "$CC" > buildtools/$BUILDTARGET/clang/bin/clang'
        - '*:*:printf ''#!/bin/sh\nexec %s "$@"\n'' "$CXX" > buildtools/$BUILDTARGET/clang/bin/clang++'
        - '*:*:chmod +x buildtools/$BUILDTARGET/clang/bin/clang buildtools/$BUILDTARGET/clang/bin/clang++'
        - '*:*:ln -s $(which llvm-ar) buildtools/$BUILDTARGET/clang/bin/llvm-ar'
        - '*:*:ln -s $(which llvm-nm) buildtools/$BUILDTARGET/clang/bin/llvm-nm'
        - '*:*:ln -s $(which llvm-strip) buildtools/$BUILDTARGET/clang/bin/llvm-strip'
        - '*:*:ln -s $NATIVEPREFIX/_/bin/llvm-objcopy buildtools/$BUILDTARGET/clang/bin/llvm-objcopy'
        - '*:*:ln -s $NATIVEPREFIX/_/bin/llvm-readelf buildtools/$BUILDTARGET/clang/bin/llvm-readelf'
        - '*:*:chmod +x buildtools/$BUILDTARGET/clang/bin/llvm-ar'
        - '*:*:sed -i.bak ''s/"-Wno-dangling-reference",/ /g'' runtime/BUILD.gn'
        - '*:*:mkdir -p tools/sdks/dart-sdk/bin'
        - '*:*:ln -s $(which dart) tools/sdks/dart-sdk/bin/dart'
        - '*:*:python3 ./tools/generate_package_config.py # HOOK Generate the .dart_tool/package_confg.json file.'
        - '*:*:echo 3.5.0-278.0.dev > sdk/version'
        - '*:*:mkdir -p third_party/devtools/web'
        - '*:*:echo ''no devtools :('' > third_party/devtools/web/index.html'
        - '*:*:sed -i.bak ''s/-std=c++14/-std=c++17/g'' ./third_party/boringssl/BUILD.gn'
        - darwin_*:*:printf 'print("%s")\nprint("26.1")\n' "$NATIVEPREFIX/_/SDK/MacOSX26.1.sdk" > build/mac/find_sdk.py
        - '*:*:python3 ./tools/build.py --mode=product create_sdk --verbose'
        - '*:*:mkdir -p $STAGING_DIR$NATIVEPREFIX'
        - linux_*:*:cp -a $(find out -name dart-sdk -type d)/bin $STAGING_DIR$NATIVEPREFIX/
        - linux_*:*:cp -a $(find out -name dart-sdk -type d)/include $STAGING_DIR$NATIVEPREFIX/
        - linux_*:*:cp -a $(find out -name dart-sdk -type d)/lib $STAGING_DIR$NATIVEPREFIX/
        - darwin_*:*:cp -a $(find xcodebuild -name dart-sdk -type d)/bin $STAGING_DIR$NATIVEPREFIX/
        - darwin_*:*:cp -a $(find xcodebuild -name dart-sdk -type d)/include $STAGING_DIR$NATIVEPREFIX/
        - darwin_*:*:cp -a $(find xcodebuild -name dart-sdk -type d)/lib $STAGING_DIR$NATIVEPREFIX/
        - '*:*:$STAGING_DIR$NATIVEPREFIX/bin/dart --version'
